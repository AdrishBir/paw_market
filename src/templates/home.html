<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt or Post Pet</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #d0f0c0, #f1f8e9); /* Updated to light green */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: #333;
        }

        .page-wrapper {
            display: flex;
            align-items: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            justify-content: flex-start; /* Align items to the left */
        }
        

        .container {
            text-align: left; /* Align the content inside the container to the left */
            padding: 24px;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 320px;
            margin-left: -175px;
        }
        

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.88rem; /* Increased by 20% */
            color: #4CAF50;
            margin-bottom: 8px;
            text-align: left; /* Pushed to the left */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        p.info-text {
            font-size: 1.2rem;
            color: #555;
            background: linear-gradient(90deg, #D4AF37, #A9A9A9, #D4AF37); /* Softer gold and silver gradient */
            background-size: 200% auto; /* Double width for animation */
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent; /* Show only the gradient */
            animation: shine 2s linear infinite; /* Animate gradient */
        }
        
        @keyframes shine {
            0% {
                background-position: 0% 50%; /* Start position */
            }
            100% {
                background-position: 100% 50%; /* End position */
            }
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            padding: 12px;
            font-size: 1rem;
            background: linear-gradient(135deg, #4CAF50, #66BB6A); /* Gradient for 3D effect */
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3), 
                        inset 0 -3px 5px rgba(0, 0, 0, 0.2); /* Outer and inset shadow for depth */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .option-btn:hover {
            transform: translateY(-5px); /* Floating effect on hover */
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4), 
                        inset 0 -3px 5px rgba(0, 0, 0, 0.2); /* Stronger shadow on hover */
        }
        
        .option-btn:active {
            transform: translateY(2px); /* Slight press-in effect */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2), 
                        inset 0 3px 5px rgba(0, 0, 0, 0.3); /* Adjusted shadow for active state */
        }
        

        .footer {
            font-size: 0.8rem;
            color: #777;
        }

        .footer a {
            color: #4CAF50;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .image-wrapper img {
            width: 130%; /* Increase width by 30% */
            height: auto; /* Maintain aspect ratio */
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            .page-wrapper {
                flex-direction: column;
                gap: 10px;
            }

            .image-wrapper img {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="container">
            <h1>Find Your New Best Friend</h1>
            <p class="info-text">Adopt a loving companion or help them find a home today!</p>

            <div class="options">
                <button class="option-btn" id="adoptBtn">Adopt a Pet</button>
                <button class="option-btn" id="postAdoptBtn">Post a Pet for Adoption</button>
            </div>

            <p class="footer">Questions? <a href="mailto:support@petadopt.com">Contact us</a></p>
        </div>

        <div class="image-wrapper">
            <img src="https://img.freepik.com/free-vector/collection-hand-drawn-people-with-animals_52683-66528.jpg" alt="People with Animals">
        </div>
    </div>

    <script>
        const adoptBtn = document.getElementById('adoptBtn');
        const postAdoptBtn = document.getElementById('postAdoptBtn');

        adoptBtn.addEventListener('click', () => {
            window.location.href = '/register';
        });

        postAdoptBtn.addEventListener('click', () => {
            window.location.href = '/list-pet';
        });
    </script>
</body>
</html>
