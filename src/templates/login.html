<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/login.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://as1.ftcdn.net/v2/jpg/04/62/19/20/1000_F_462192023_MApCjn680UHnnKbDsK9ZYY03OIt8OIsF.jpg') no-repeat;
            background-size: contain;
            background-position: right center;
            background-attachment: fixed;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            background: rgba(0, 128, 0, 0.5);
            padding: 1.5rem 0;
            text-align: center;
            color: white;
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0;
            font-family: 'Pacifico', cursive;
            font-size: 2.5rem;
        }

        main {
            width: 90%;
            max-width: 400px;
            margin: 2rem 10%;
            padding: 2rem 0;
            background: rgba(0, 128, 0, 0.2);
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 128, 0, 0.2);
            text-align: center;
        }

        form input {
            width: 80%; /* Reduced to 80% of the original width */
            padding: 0.8rem; /* Slightly smaller padding */
            margin: 0.8rem auto; /* Centered margin */
            border: 2px solid #228B22;
            border-radius: 8px;
            font-size: 0.9rem; /* Slightly smaller font size */
            background: #f5f5f5;
        }

        form button {
            width: 80%; /* Matches input size */
            padding: 0.8rem;
            margin-top: 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(45deg, #32CD32, #228B22);
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: rgba(0, 128, 0, 0.5);
            color: white;
            margin-top: auto;
            position: relative;
        }

        #login-message {
            margin-top: 1rem;
            color: #228B22;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome!</h1>
    </header>
    <main>
        <form id="login-form">
            <input type="email" id="login-email" placeholder="Enter your email" required />
            <input type="password" id="login-password" placeholder="Enter your password" required />
            <button type="submit">Sign In</button>
        </form>
        <p id="login-message"></p>
    </main>
    <footer>
        <p>&copy; 2024 Pet Adoption Hub. All rights reserved.</p>
    </footer>
</body>
</html>
